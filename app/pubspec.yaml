name: hiluxos
description: "hiluxOS — Flutter frontend for the in-vehicle infotainment system."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.0

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Audio playback + visualization
  audioplayers: ^6.1.0

  # On-screen virtual keyboard for the touch-only embedded display
  # (RPi + Cage/Wayland has no system IME). Pure Dart, no native code.
  virtual_keypad: ^1.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/