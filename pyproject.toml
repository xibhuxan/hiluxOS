[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiluxos"
version = "0.1.0"
description = "Modular automotive infotainment system for Raspberry Pi and MiniPC"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
]

[project.scripts]
hiluxos = "hiluxos.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hiluxos*"]
namespaces = false